# Secret scanning (AURA-INT-001). Runs the gitleaks CLI directly: the
# gitleaks/gitleaks-action wrapper needs a paid license key on organization
# accounts, while the CLI is MIT-licensed. The binary is pinned by version and
# SHA-256; no repository secrets are used.
name: Secrets scan

on:
  pull_request:
  push:
    branches:
      - admin-upload
      - main
      - 'codex/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      # Scans every commit reachable from the checked-out ref (including a
      # pull request's commits) and fails the job on any finding. --redact
      # keeps matched values out of the job log.
      - name: Scan git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
